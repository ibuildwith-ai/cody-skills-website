<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Chooser — Cody Skills Docs</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    background:#0e0d14;color:#e8e6f0;height:100vh;display:flex;flex-direction:column;}
  header{padding:14px 22px;display:flex;align-items:center;gap:20px;
    border-bottom:1px solid #26243a;flex-shrink:0;}
  .title{font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .title span{color:#8b86a8;font-weight:500;}
  .tabs{display:flex;gap:8px;}
  .tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    background:#1b1a28;border:1px solid #2c2a42;color:#b6b2cc;transition:.13s;}
  .tab:hover{border-color:#4a4670;color:#fff;}
  .tab.active{background:linear-gradient(135deg,#6d4aff,#9b7dff);color:#fff;border-color:transparent;}
  .tab .n{opacity:.6;margin-right:6px;}
  .hint{margin-left:auto;font-size:12px;color:#7a7595;}
  .desc{padding:9px 22px;font-size:12.5px;color:#9a96b3;background:#16151f;
    border-bottom:1px solid #26243a;flex-shrink:0;}
  .desc b{color:#cfccdf;}
  .frame-wrap{flex:1;position:relative;background:#0e0d14;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}
</style>
</head>
<body>
  <header>
    <div class="title">Design Chooser <span>— Cody Skills documentation site</span></div>
    <div class="tabs">
      <div class="tab active" data-src="mockup-1-stainless-minimal.html"><span class="n">1</span>Stainless Minimal</div>
      <div class="tab" data-src="mockup-2-claude-docs.html"><span class="n">2</span>Claude Docs</div>
      <div class="tab" data-src="mockup-3-cody-branded.html"><span class="n">3</span>Cody Branded</div>
      <div class="tab" data-src="mockup-4-ibuildwith.html"><span class="n">4</span>iBuildWith.ai</div>
    </div>
    <div class="hint">Try the ▾ switcher &amp; ⌘K search — then pick a direction</div>
  </header>
  <div class="desc" id="desc"></div>
  <div class="frame-wrap">
    <iframe id="frame" src="mockup-1-stainless-minimal.html"></iframe>
  </div>

<script>
  var descriptions = {
    "mockup-1-stainless-minimal.html":
      "<b>Stainless Minimal.</b> Light and airy, generous whitespace, restrained typography, thin borders. Skill switcher as a quiet dropdown, a slim 'on this page' rail. Closest to stainless.com/docs — calm and content-first.",
    "mockup-2-claude-docs.html":
      "<b>Claude Docs.</b> Closest to code.claude.com — a warm dark theme with a coral accent. Comfortable, dense, developer-familiar. Top bar trimmed to brand + skill switcher + search.",
    "mockup-3-cody-branded.html":
      "<b>Cody Branded.</b> Bolder identity — a deep violet tinted sidebar, a violet gradient accent, gradient headline, lifted cards. More personality for the Cody Skills brand while keeping the same layout.",
    "mockup-4-ibuildwith.html":
      "<b>iBuildWith.ai Theme.</b> Themed directly from ibuildwith.ai's stylesheet — DM Sans, #121212 dark background, #22c55e green accent, #2a2a2a borders. Sidebar shows the standardized model: 'core' badges on Getting Started / Workflow / Reference, 'skill-specific' on Commands."
  };
  var tabs = document.querySelectorAll('.tab');
  var frame = document.getElementById('frame');
  var desc = document.getElementById('desc');
  function show(src){
    frame.src = src;
    desc.innerHTML = descriptions[src];
  }
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      show(t.dataset.src);
    });
  });
  show("mockup-1-stainless-minimal.html");
</script>
</body>
</html>
