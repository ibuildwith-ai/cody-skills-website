<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161616"/>
      <stop offset="100%" style="stop-color:#0e0e0e"/>
    </linearGradient>
    <linearGradient id="greenFade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.13"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="url(#bg3)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="40" x2="600" y2="40" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="280" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="280" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="280" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#22c55e" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke="#22c55e" stroke-width="0.5"/>
  </g>

  <!-- Green glow background -->
  <ellipse cx="300" cy="140" rx="210" ry="115" fill="url(#greenFade3)"/>

  <!-- Main audit report panel -->
  <rect x="170" y="40" width="260" height="200" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect x="170" y="40" width="260" height="34" rx="8" fill="#1e1e1e"/>
  <rect x="170" y="68" width="260" height="6" fill="#1e1e1e"/>

  <!-- Header dots -->
  <circle cx="188" cy="58" r="4" fill="#ef4444" opacity="0.7"/>
  <circle cx="202" cy="58" r="4" fill="#eab308" opacity="0.7"/>
  <circle cx="216" cy="58" r="4" fill="#22c55e" opacity="0.7"/>

  <!-- "Audit Report" title row -->
  <rect x="190" y="86" width="80" height="6" rx="3" fill="#22c55e" opacity="0.6"/>
  <rect x="190" y="98" width="150" height="4" rx="2" fill="#2a2a2a"/>

  <!-- Score badge top-right inside the panel -->
  <rect x="355" y="84" width="62" height="22" rx="11" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="386" y="99" font-family="DM Sans, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle" font-weight="600">PASS 92%</text>

  <!-- Findings rows: each is a rule with a status icon -->

  <!-- Row 1 — pass (green check) -->
  <circle cx="198" cy="128" r="8" fill="#22c55e" opacity="0.15"/>
  <polyline points="194,128 197,131 203,125" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <rect x="214" y="125" width="160" height="5" rx="2.5" fill="#2a2a2a"/>
  <rect x="378" y="125" width="34" height="5" rx="2.5" fill="#22c55e" opacity="0.4"/>

  <!-- Row 2 — pass (green check) -->
  <circle cx="198" cy="148" r="8" fill="#22c55e" opacity="0.15"/>
  <polyline points="194,148 197,151 203,145" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <rect x="214" y="145" width="140" height="5" rx="2.5" fill="#2a2a2a"/>
  <rect x="378" y="145" width="34" height="5" rx="2.5" fill="#22c55e" opacity="0.4"/>

  <!-- Row 3 — warn (yellow ! / dash) -->
  <circle cx="198" cy="168" r="8" fill="#eab308" opacity="0.18"/>
  <rect x="197" y="165" width="2" height="5" rx="1" fill="#eab308"/>
  <rect x="197" y="172" width="2" height="2" rx="1" fill="#eab308"/>
  <rect x="214" y="165" width="170" height="5" rx="2.5" fill="#2a2a2a"/>
  <rect x="388" y="165" width="24" height="5" rx="2.5" fill="#eab308" opacity="0.4"/>

  <!-- Row 4 — fail (red X) -->
  <circle cx="198" cy="188" r="8" fill="#ef4444" opacity="0.18"/>
  <line x1="195" y1="185" x2="201" y2="191" stroke="#ef4444" stroke-width="1.6"/>
  <line x1="201" y1="185" x2="195" y2="191" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="214" y="185" width="150" height="5" rx="2.5" fill="#2a2a2a"/>
  <rect x="388" y="185" width="24" height="5" rx="2.5" fill="#ef4444" opacity="0.45"/>

  <!-- Row 5 — pass (green check) -->
  <circle cx="198" cy="208" r="8" fill="#22c55e" opacity="0.15"/>
  <polyline points="194,208 197,211 203,205" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <rect x="214" y="205" width="130" height="5" rx="2.5" fill="#2a2a2a"/>
  <rect x="378" y="205" width="34" height="5" rx="2.5" fill="#22c55e" opacity="0.4"/>

  <!-- Spec panel (left) -->
  <g transform="translate(55, 60)">
    <rect width="100" height="125" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" opacity="0.85"/>
    <text x="14" y="22" font-family="DM Sans, sans-serif" font-size="9" fill="#666" font-weight="500">Spec</text>
    <!-- Spec rule list -->
    <rect x="14" y="34" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="35" width="50" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="14" y="46" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="47" width="56" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="14" y="58" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="59" width="44" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="14" y="70" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="71" width="52" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="14" y="82" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="83" width="38" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="14" y="94" width="14" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="32" y="95" width="48" height="3" rx="1.5" fill="#2a2a2a"/>
  </g>

  <!-- Dotted line from spec to report -->
  <line x1="155" y1="130" x2="170" y2="130" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Findings summary card (right) -->
  <g transform="translate(445, 95)">
    <rect width="100" height="115" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" opacity="0.85"/>
    <text x="14" y="22" font-family="DM Sans, sans-serif" font-size="9" fill="#666" font-weight="500">Findings</text>

    <!-- Pass count -->
    <circle cx="20" cy="42" r="6" fill="#22c55e" opacity="0.2"/>
    <polyline points="17,42 19,44 23,40" stroke="#22c55e" stroke-width="1.4" fill="none"/>
    <text x="34" y="46" font-family="DM Sans, sans-serif" font-size="10" fill="#22c55e" font-weight="600" opacity="0.85">12</text>
    <text x="54" y="46" font-family="DM Sans, sans-serif" font-size="8" fill="#666">pass</text>

    <!-- Warn count -->
    <circle cx="20" cy="64" r="6" fill="#eab308" opacity="0.2"/>
    <rect x="19.5" y="61" width="1" height="3" fill="#eab308"/>
    <rect x="19.5" y="66" width="1" height="1.5" fill="#eab308"/>
    <text x="34" y="68" font-family="DM Sans, sans-serif" font-size="10" fill="#eab308" font-weight="600" opacity="0.85">2</text>
    <text x="46" y="68" font-family="DM Sans, sans-serif" font-size="8" fill="#666">warn</text>

    <!-- Fail count -->
    <circle cx="20" cy="86" r="6" fill="#ef4444" opacity="0.22"/>
    <line x1="17" y1="83" x2="23" y2="89" stroke="#ef4444" stroke-width="1.4"/>
    <line x1="23" y1="83" x2="17" y2="89" stroke="#ef4444" stroke-width="1.4"/>
    <text x="34" y="90" font-family="DM Sans, sans-serif" font-size="10" fill="#ef4444" font-weight="600" opacity="0.85">1</text>
    <text x="46" y="90" font-family="DM Sans, sans-serif" font-size="8" fill="#666">fail</text>

    <!-- Mini progress bar -->
    <rect x="14" y="100" width="72" height="4" rx="2" fill="#2a2a2a" opacity="0.5"/>
    <rect x="14" y="100" width="58" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
  </g>

  <!-- Dotted line from report to findings -->
  <line x1="430" y1="140" x2="445" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
</svg>
